services:
  - type: web
    name: siddhivinayak-expense-manager
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: siddhivinayak-db
          property: connectionString

databases:
  - name: siddhivinayak-db
    plan: free
    databaseName: siddhivinayak_expense_manager
    user: siddhivinayak
