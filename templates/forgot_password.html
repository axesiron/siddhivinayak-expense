{% extends "base.html" %}
{% block title %}Forgot Password · {{ app_name }}{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><i class="fa-solid fa-key"></i></div>
    <div class="auth-title">Reset your password</div>
    <div class="auth-sub">Enter your registered email and we'll send reset instructions.</div>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-brand w-100 py-2">Send Reset Link</button>
    </form>
    <div class="text-center mt-3 small text-muted">
      <a href="{{ url_for('auth.login') }}">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
