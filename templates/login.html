{% extends "base.html" %}
{% block title %}Login · {{ app_name }}{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><img src="{{ url_for('static', filename='images/icon-192.png') }}" alt="{{ app_name }}" style="width:32px;height:32px;object-fit:contain;"></div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to {{ app_name }}</div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@siddhivinayak.com" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-brand w-100 py-2">Sign In</button>
    </form>

    <div class="text-center mt-3 small text-muted">
      New employee? <a href="{{ url_for('auth.register') }}">Create an account</a>
    </div>

    <button id="installAppBtn" class="btn btn-outline-brand w-100 py-2 mt-3" type="button">
      <i class="fa-solid fa-download me-1"></i> Download App
    </button>
  </div>
</div>
{% endblock %}
